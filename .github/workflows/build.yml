name: Build APK and Java

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Check environment
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Build all
        run: |
          gradle :protocol:test \
                 :android-app:assembleDebug \
                 :paper-plugin:build \
                 :voice-server:build \
                 --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android-app/build/outputs/apk/debug/*.apk

      - name: Upload Paper Plugin
        uses: actions/upload-artifact@v4
        with:
          name: paper-plugin
          path: paper-plugin/build/libs/*.jar

      - name: Upload Voice Server
        uses: actions/upload-artifact@v4
        with:
          name: voice-server
          path: voice-server/build/libs/*-all.jar
